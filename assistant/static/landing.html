<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zavolej za mě</title>
<meta name="description" content="A phone assistant that makes your calls: it speaks the local language, calls several places, negotiates and reports back.">
<link rel="stylesheet" href="/base.css">
<style>
main{max-width:960px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.brand{font-weight:800;font-size:1.05rem}
.langs{display:flex;gap:4px}.langs button{background:transparent;color:var(--mute);border:1px solid var(--line);padding:4px 10px;font-size:.85rem;font-weight:600}
.langs button[aria-pressed=true]{background:var(--soft);color:var(--brand);border-color:var(--brand)}
.hero{padding:24px 0 8px}.hero h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em;max-width:16ch}
.hero p.lead{font-size:1.15rem;color:var(--mute);max-width:56ch;margin-bottom:24px}.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn.big{padding:14px 22px;font-size:1.05rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:12px 0}
.pain{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.pain .em{font-size:1.6rem}.pain h3{margin:8px 0 6px;font-size:1.1rem}.pain p{color:var(--mute);margin:0}
.pain.lead{border-color:var(--brand);background:var(--soft)}
section.block{margin:44px 0}section.block>h2{font-size:1.5rem;margin-bottom:6px}section.block>p.sub{color:var(--mute);margin-bottom:16px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.steps div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.steps div::before{counter-increment:s;content:counter(s);display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:700;align-items:center;justify-content:center;margin-bottom:8px}
.steps b{display:block;margin-bottom:4px}.steps span{color:var(--mute)}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.case{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}.case b{display:block}.case span{color:var(--mute);font-size:.9rem}
.sample{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;overflow-x:auto}.sample table{border-collapse:collapse;width:100%;min-width:420px}
.sample th{text-align:left;font-size:.8rem;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}.sample td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.sample .hi{color:var(--brand);font-weight:700}
.quote{border-left:3px solid var(--brand);padding:6px 12px;margin:12px 0 0;color:var(--mute);font-style:italic}
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 20px;padding:0;list-style:none}.trust li{padding-left:26px;position:relative}.trust li::before{content:"✓";position:absolute;left:0;color:var(--brand);font-weight:800}
.final{text-align:center;background:var(--soft);border-radius:16px;padding:32px 16px}.final h2{margin-top:0}
footer{color:var(--mute);font-size:.85rem;margin-top:40px}
</style></head>
<body><main>
<div class="top"><span class="brand">📞 Zavolej za mě</span><div class="langs" role="group" aria-label="Language"></div></div>
<div id="page"></div>
</main>
<script>
const T={

 casesT:'What people delegate',cases:[['Find a venue','free dates, price per person, deposit'],['Book a table','with allergies, a pram and parking sorted'],['Barter deals','an event at a café for posts and guests'],['Doctors and dentists','nearest free slot and price'],['Home repairs','who can come this week, for how much'],['Officials and landlords','in the language they speak']],

 try:'Vyzkoušet demo',how:'Jak to funguje',

  ['😮‍💨','Živé hovory vás vyčerpávají','Žádné čekání na lince ani „můžete to zopakovat“. Napíšete, co potřebujete, asistent zavolá a nepříjemnou část vyřeší za vás.'],
  ['📋','Hovorů je moc','Pět restaurací, tři zubaři, deset prostorů. Obvolá je jeden po druhém a dá vám jednu tabulku: kdo má volno, kolik to stojí, co chtějí.']],
 howT:'Tři kroky, bez aplikace',howS:'Funguje s jakýmkoli číslem, na které byste zavolali sami.',
 steps:[['Řekněte, co potřebujete','„Prostor pro 20 lidí v pátek, kolem 600 Kč na osobu, s místem pro kočárek.“'],['Asistent volá','Představí se jako váš automatický asistent, zeptá se na vše a kde to dává smysl, vyjednává.'],['Vy rozhodnete','Živý přepis, srovnávací tabulka a další kroky. Vyberete a on rezervaci dokončí.']],
 casesT:'Co lidé delegují',cases:[['Místo pro akci','volné termíny, cena na osobu, záloha'],['Rezervace stolu','i s alergiemi, kočárkem a parkováním'],['Barterová spolupráce','akce v kavárně za příspěvky a hosty'],['Lékaři a zubaři','nejbližší volný termín a cena'],['Opravy doma','kdo přijde tento týden a za kolik'],['Úřady a pronajímatelé','v jazyce, kterým mluví oni']],
 sampleT:'Co dostanete zpět',sampleS:'Skutečná podoba reportu z dema: tři restaurace, jedno rozhodnutí.',
 cols:['Kam','Termín','Na osobu'],rows:[['Restaurace U Lípy','volno · salonek pro 25','650 Kč'],['Lokál Dlouhá','jen v sobotu','520 Kč'],['Bistro Karlín','volno · hlavní sál','590 Kč · nejlevnější s volnem']],
 quote:'„Ano, kočárek můžete dát k oknu a kuchyně vynechá banány a okurky.“',

 finalT:'Udělejte první hovor hned',finalS:'Demo volá na přednastavená testovací čísla, restauraci si můžete zahrát sami.',foot:'Demo týmu Jsem včas. Hovory se přepisují.'},
ru:{lang:'Русский',hero:'Звонки, которые не хочется делать. Сделаем за вас.',lead:'Телефонный ассистент звонит на местном языке, обзванивает несколько мест сразу, торгуется и возвращается с ответами, по которым вы принимаете решение. Вы подтверждаете, он бронирует.',
 try:'Попробовать демо',how:'Как это работает',

  ['😮‍💨','Живые звонки выматывают','Без ожидания на линии и «повторите, пожалуйста». Пишете, что нужно, ассистент звонит и берёт неловкую часть на себя.'],
  ['📋','Звонков слишком много','Пять ресторанов, три стоматологии, десять площадок. Он обзванивает их по очереди и даёт одну таблицу: у кого свободно, сколько стоит, чего хотят.']],

 steps:[['Скажите, что нужно','«Зал на 20 человек в пятницу, около 600 Kč с человека, с местом для коляски».'],['Ассистент звонит','Представляется вашим автоматическим ассистентом, задаёт все вопросы и торгуется, где это уместно.'],['Вы решаете','Живая расшифровка, таблица сравнения и следующие шаги. Выбираете, и он завершает бронь.']],

 sampleT:'Что вы получаете',sampleS:'Реальный вид отчёта из демо: три ресторана, одно решение.',

 quote:'«Да, коляску можно поставить у окна, а кухня уберёт бананы и огурцы».',

const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='on')for(const[n,f]of Object.entries(v))e.addEventListener(n,f);else if(k in e)e[k]=v;else e.setAttribute(k,v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c);return e};
const pick=()=>{try{const s=localStorage.getItem('lang');if(T[s])return s}catch{}const n=(navigator.language||'en').slice(0,2);return T[n]?n:(n==='sk'?'cs':n==='uk'||n==='be'?'ru':'en')};

 document.querySelector('.langs').replaceChildren(...Object.keys(T).map(k=>el('button',{type:'button','aria-pressed':String(k===lang),on:{click:()=>{lang=k;try{localStorage.setItem('lang',k)}catch{}render()}}},k.toUpperCase())));
 const demo=el('a',{className:'btn big',href:'/demo'},t.try);
 document.getElementById('page').replaceChildren(

   el('table',{},el('thead',{},el('tr',{},t.cols.map(c=>el('th',{scope:'col'},c)))),el('tbody',{},t.rows.map((r,i)=>el('tr',{},r.map((c,j)=>el('td',{className:i===2&&j===2?'hi':''},j===0?el('b',{},c):c)))))),

  el('footer',{},t.foot))}
render();
