<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zavolej za mě</title>
<meta name="description" content="A phone assistant that makes your calls in the local language, calls several places, negotiates and reports back.">
<link rel="stylesheet" href="/base.css">
<style>
/* mobile first; wider screens only add columns */
main{padding:16px 16px 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-weight:800}
.langs{display:flex;gap:4px}.langs button{background:transparent;color:var(--mute);border:1px solid var(--line);padding:6px 10px;font-size:.8rem;font-weight:700;min-height:36px}
.langs button[aria-pressed=true]{background:var(--soft);color:var(--brand);border-color:var(--brand)}
h1.hero{font-size:2.1rem;line-height:1.08;letter-spacing:-.02em;margin:8px 0 12px}
.lead{font-size:1.05rem;color:var(--mute);margin:0 0 20px}
.btn.big{display:block;text-align:center;padding:15px 20px;font-size:1.05rem;border-radius:12px}
.pains{display:grid;gap:10px;margin:28px 0}
.pain{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.pain .em{font-size:1.5rem;line-height:1.2;flex:none}.pain b{display:block;margin-bottom:2px}.pain p{margin:0;color:var(--mute);font-size:.95rem}
.pain.first{border-color:var(--brand);background:var(--soft)}
h2.sec{font-size:1.35rem;margin:36px 0 12px}
.steps{display:grid;gap:10px;counter-reset:s}.steps div{display:flex;gap:12px;align-items:flex-start}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:800;display:flex;align-items:center;justify-content:center}
.steps b{display:block}.steps span{color:var(--mute);font-size:.95rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips span{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem;white-space:nowrap}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.res .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.res .r:last-of-type{border-bottom:0}
.res .r b{display:block}.res .r small{color:var(--mute)}.res .r .p{text-align:right;white-space:nowrap}.res .hi{color:var(--brand);font-weight:800}
.quote{border-left:3px solid var(--brand);padding:4px 12px;margin:8px 0 6px;color:var(--mute);font-style:italic;font-size:.95rem}
.trust{list-style:none;padding:0;margin:0;display:grid;gap:8px}.trust li{padding-left:26px;position:relative}.trust li::before{content:"✓";position:absolute;left:0;color:var(--brand);font-weight:800}
.final{background:var(--soft);border-radius:16px;padding:24px 16px;margin-top:36px;text-align:center}.final h2{margin:0 0 6px}.final p{color:var(--mute);margin:0 0 14px}
footer{color:var(--mute);font-size:.8rem;margin-top:24px}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .2s}
.sticky.on{transform:none}@media (prefers-reduced-motion:reduce){.sticky{transition:none}}
@media (min-width:720px){main{max-width:960px;padding:32px 24px 64px}h1.hero{font-size:3.2rem;max-width:15ch}.lead{font-size:1.2rem;max-width:52ch}
 .btn.big{display:inline-block}.pains{grid-template-columns:repeat(3,1fr)}.pain{flex-direction:column}.steps{grid-template-columns:repeat(3,1fr)}
 .chips{flex-wrap:wrap;overflow:visible;margin:0;padding:0}.sticky{display:none}}
</style></head>
<body><main>
<div class="top"><span class="brand">📞 Zavolej za mě</span><div class="langs" role="group" aria-label="Language"></div></div>
<div id="page"></div>
</main>
<div class="sticky" id="sticky"></div>
<script>
const T={
en:{hero:"Calls you'd rather not make. Done for you.",lead:'Your phone assistant speaks the local language, calls several places, negotiates and brings back the answers. You decide, it books.',try:'Try the demo — it’s free',
 pains:[['🗣️','Don’t speak Czech?','Your local voice on any call: doctor, office, landlord, plumber. Write in your language, read the result in yours.'],
  ['😮‍💨','Hate phone calls?','No hold music, no small talk. Type what you need, the assistant makes the call.'],
  ['📋','Too many calls?','Five venues, three dentists. You get one table back: who is free and what it costs.']],
 howT:'How it works',steps:[['Tell it what you need','“A room for 20 on Friday, about 600 CZK each.”'],['It makes the calls','Says it is your automated assistant, asks everything, negotiates.'],['You decide, it books','Live transcript and a comparison. Pick one, done.']],
 casesT:'People delegate',cases:['🏛️ Office appointments','🎉 Event venues','🍽️ Table bookings','🤝 Barter deals','🦷 Doctors and dentists','🔧 Home repairs','🏠 Landlords'],
 resT:'What you get back',res:[['Restaurace U Lípy','free · private room','650 CZK'],['Lokál Dlouhá','only Saturday','520 CZK'],['Bistro Karlín','free · main room','590 CZK']],best:'cheapest free',
 quote:'“The pram can stand by the window, and the kitchen will leave out bananas and cucumbers.”',
 trustT:'Safe by design',trust:['Always says it is an AI assistant','Never pays or gives card details','Books only what you asked for','Transcripts deleted after 30 days'],
 finalT:'Make your first call',finalS:'The demo calls preset test phones, so you can play the restaurant yourself.',foot:'A demo by the Jsem včas team. Calls are transcribed.'},
cs:{hero:'Hovory, do kterých se vám nechce. Vyřízené za vás.',lead:'Telefonní asistent mluví místním jazykem, obvolá víc míst, vyjedná podmínky a přinese odpovědi. Vy rozhodnete, on zarezervuje.',try:'Vyzkoušet demo zdarma',
 pains:[['🗣️','Nemluvíte česky?','Váš místní hlas v každém hovoru: lékař, úřad, pronajímatel, řemeslník. Píšete svým jazykem, výsledek čtete ve svém.'],
  ['😮‍💨','Nesnášíte telefonování?','Žádné čekání na lince ani zdvořilostní řeči. Napíšete, co potřebujete, a asistent zavolá.'],
  ['📋','Hovorů je moc?','Pět podniků, tři zubaři. Dostanete jednu tabulku: kdo má volno a kolik to stojí.']],
 howT:'Jak to funguje',steps:[['Řekněte, co potřebujete','„Prostor pro 20 lidí v pátek, kolem 600 Kč na osobu.“'],['Asistent volá','Představí se jako automat, zeptá se na vše, vyjednává.'],['Vy rozhodnete, on zarezervuje','Živý přepis a srovnání. Vyberete a je hotovo.']],
 casesT:'Co lidé delegují',cases:['🏛️ Úřady','🎉 Prostory pro akce','🍽️ Rezervace stolu','🤝 Barter','🦷 Lékaři a zubaři','🔧 Opravy','🏠 Pronajímatelé'],
 resT:'Co dostanete zpět',res:[['Restaurace U Lípy','volno · salonek','650 Kč'],['Lokál Dlouhá','jen sobota','520 Kč'],['Bistro Karlín','volno · hlavní sál','590 Kč']],best:'nejlevnější s volnem',
 quote:'„Kočárek můžete dát k oknu a kuchyně vynechá banány a okurky.“',
 trustT:'Bezpečné od základu',trust:['Vždy řekne, že je AI asistent','Nikdy neplatí a nedává údaje z karty','Rezervuje jen to, co jste zadali','Přepisy se mažou po 30 dnech'],
 finalT:'Udělejte první hovor',finalS:'Demo volá na testovací telefony, restauraci si můžete zahrát sami.',foot:'Demo týmu Jsem včas. Hovory se přepisují.'},
ru:{hero:'Звонки, которые не хочется делать. Сделаем за вас.',lead:'Телефонный ассистент говорит на местном языке, обзванивает несколько мест, торгуется и приносит ответы. Вы решаете, он бронирует.',try:'Попробовать демо бесплатно',
 pains:[['🗣️','Не говорите по-чешски?','Ваш местный голос в любом звонке: врач, ведомство, арендодатель, мастер. Пишете на своём языке, итог читаете на своём.'],
  ['😮‍💨','Не любите звонить?','Без ожидания на линии и неловких пауз. Пишете, что нужно, ассистент звонит.'],
  ['📋','Слишком много звонков?','Пять площадок, три стоматологии. Получаете одну таблицу: кто свободен и сколько стоит.']],
 howT:'Как это работает',steps:[['Скажите, что нужно','«Зал на 20 человек в пятницу, около 600 Kč с человека».'],['Ассистент звонит','Представляется автоматом, задаёт все вопросы, торгуется.'],['Вы решаете, он бронирует','Живая расшифровка и сравнение. Выбрали — готово.']],
 casesT:'Что делегируют',cases:['🏛️ Ведомства','🎉 Площадки','🍽️ Бронь столика','🤝 Бартер','🦷 Врачи и стоматологи','🔧 Ремонт','🏠 Арендодатели'],
 resT:'Что вы получаете',res:[['Restaurace U Lípy','свободно · отдельный зал','650 Kč'],['Lokál Dlouhá','только суббота','520 Kč'],['Bistro Karlín','свободно · общий зал','590 Kč']],best:'дешевле всех',
 quote:'«Коляску можно поставить у окна, а кухня уберёт бананы и огурцы».',
 trustT:'Безопасно по умолчанию',trust:['Всегда говорит, что он AI-ассистент','Никогда не платит и не называет данные карты','Бронирует только то, что вы просили','Расшифровки удаляются через 30 дней'],
 finalT:'Сделайте первый звонок',finalS:'Демо звонит на тестовые телефоны, ресторан можно сыграть самому.',foot:'Демо команды Jsem včas. Звонки расшифровываются.'}};
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='on')for(const[n,f]of Object.entries(v))e.addEventListener(n,f);else if(k in e)e[k]=v;else e.setAttribute(k,v)}for(const c of kids.flat())if(c!=null&&c!==false)e.append(c);return e};
const pick=()=>{try{const s=localStorage.getItem('lang');if(T[s])return s}catch{}const n=(navigator.language||'en').slice(0,2);return T[n]?n:n==='sk'?'cs':n==='uk'||n==='be'?'ru':'en'};
let lang=pick();
function render(){const t=T[lang];document.documentElement.lang=lang;
 document.querySelector('.langs').replaceChildren(...Object.keys(T).map(k=>el('button',{type:'button','aria-pressed':String(k===lang),on:{click:()=>{lang=k;try{localStorage.setItem('lang',k)}catch{}render()}}},k.toUpperCase())));
 const cta=()=>el('a',{className:'btn big',href:'/demo?lang='+lang},t.try);
 const hero=cta();
 document.getElementById('page').replaceChildren(
  el('h1',{className:'hero'},t.hero),el('p',{className:'lead'},t.lead),hero,
  el('div',{className:'pains'},t.pains.map(([em,h,p],i)=>el('div',{className:'pain'+(i===0?' first':'')},el('span',{className:'em','aria-hidden':'true'},em),el('div',{},el('b',{},h),el('p',{},p))))),
  el('h2',{className:'sec'},t.howT),el('div',{className:'steps'},t.steps.map(([b,s])=>el('div',{},el('p',{style:'margin:0'},el('b',{},b),el('span',{},s))))),
  el('h2',{className:'sec'},t.casesT),el('div',{className:'chips'},t.cases.map(c=>el('span',{},c))),
  el('h2',{className:'sec'},t.resT),el('div',{className:'res'},t.res.map(([n,d,p],i)=>el('div',{className:'r'},el('div',{},el('b',{},n),el('small',{},d)),el('div',{className:'p'+(i===2?' hi':'')},p,i===2?el('small',{style:'display:block'},t.best):null))),el('p',{className:'quote'},t.quote)),
  el('h2',{className:'sec'},t.trustT),el('ul',{className:'trust'},t.trust.map(x=>el('li',{},x))),
  el('section',{className:'final'},el('h2',{},t.finalT),el('p',{},t.finalS),cta()),
  el('footer',{},t.foot));
 const sticky=document.getElementById('sticky');sticky.replaceChildren(cta());
 try{new IntersectionObserver(([e])=>sticky.classList.toggle('on',!e.isIntersecting)).observe(hero)}catch{sticky.classList.add('on')}}
render();
</script></body></html>
