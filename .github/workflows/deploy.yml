# Push to main → tests → build image → deploy to the VPS over SSH. Secrets live in GitHub, never in the repo:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY  (deploy key of a user allowed to run docker)
#   APP_ENV  (full contents of backend/.env: Twilio keys, PUBLIC_URL, DEMO_TO, LLM keys)
name: test-and-deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest httpx "fhir.resources>=7"
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_HOST != '' }}   # deploy is skipped until the VPS secrets exist
    steps:
      - uses: actions/checkout@v4
      - name: Copy project to VPS
        if: env.HAS_VPS == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "engine,backend,web/app,data,requirements.txt,Dockerfile,deploy"
          target: ~/plice
      - name: Build and restart
        if: env.HAS_VPS == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_ENV
          script: |
            cd ~/plice
            printf '%s\n' "$APP_ENV" > backend/.env
            PROFILE=$(grep -q '^TUNNEL_TOKEN=' backend/.env && echo "--profile tunnel" || true)
            docker compose -f deploy/docker-compose.yml $PROFILE up -d --build
            sleep 3 && curl -fsS http://localhost:8000/api/health
