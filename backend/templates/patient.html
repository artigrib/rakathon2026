<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prevence pro plíce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&display=swap">
<style>
  :root { --paper:#fff; --ink:#000; --ink-2:#555; --hair:#d9d9d9; --red:#e2001a; --on-red:#fff; }
  @media (prefers-color-scheme: dark) { :root { --paper:#000; --ink:#fff; --ink-2:#b3b3b3; --hair:#333; --red:#ff3347; --on-red:#000; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font: 20px/1.5 "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; border-top: 6px solid var(--ink); }
  h1 { font-size: 30px; line-height: 1.15; margin: 20px 0 12px; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; }
  .muted { color: var(--ink-2); font-size: 17px; }
  form { display: grid; gap: 10px; margin: 28px 0; }
  button { min-height: 64px; width: 100%; font: inherit; font-weight: 600; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); text-align: left; padding: 12px 18px; cursor: pointer; border-radius: 0; }
  button.primary { background: var(--red); border-color: var(--red); color: var(--on-red); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .quiet { min-height: 48px; border: 0; background: none; text-decoration: underline; font-weight: 400; font-size: 17px; color: var(--ink-2); padding: 8px 0; }
  .box { border-left: 6px solid var(--red); padding: 4px 0 4px 18px; margin: 16px 0; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
$content
</main>
</body>
</html>
