<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ukázka v sále Jsem včas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;700&display=swap">
<style>
  :root { --paper:#f4f4f2; --surface:#fff; --ink:#1d1d1b; --ink-2:#5a5a56; --hair:#d6d6d2; --accent:#0b5c6b; --accent-soft:#dcecef; --warn:#8a4b00; --warn-soft:#f6ead9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font: 18px/1.45 "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { padding: 24px max(16px, 3vw); display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 32px; align-items: start; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; } }
  .brand { font-weight: 700; border-top: 6px solid var(--ink); padding-top: 12px; display: inline-block; }
  h1 { font-size: 34px; line-height: 1.1; margin: 18px 0 8px; letter-spacing: -0.01em; }
  .qr { background: #fff; padding: 12px; border: 2px solid var(--ink); display: inline-block; margin: 12px 0; }
  .qr svg { width: min(320px, 70vw); height: auto; display: block; }
  .url { font-weight: 600; font-size: 20px; word-break: break-all; }
  .count { font-size: 96px; font-weight: 700; line-height: 1; margin: 18px 0 4px; font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-2); font-size: 16px; }
  .actions { display: grid; gap: 10px; margin-top: 20px; }
  button { min-height: 56px; font: inherit; font-weight: 700; border: 2px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; padding: 0 18px; }
  button[disabled] { opacity: .45; cursor: default; }
  button.quiet { background: none; color: var(--ink-2); border-color: var(--hair); font-weight: 600; min-height: 44px; }
  .sum { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 4px 0 16px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 2px solid var(--hair); padding: 12px; min-height: 104px; display: grid; gap: 4px; align-content: start; animation: pop .35s ease-out; }
  .card b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .card .st { font-weight: 700; }
  .card.live { border-color: var(--accent); }
  .card.ok { border-color: var(--accent); background: var(--accent-soft); }
  .card.miss { border-color: var(--warn); background: var(--warn-soft); }
  .tag { font-size: 14px; color: var(--ink-2); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <span class="brand">Jsem včas</span>
    <h1>Ukázka v sále</h1>
    <p class="muted">Naskenujte kód, zadejte svůj telefon a představte si, že jste pacient. Zavolá Vám hlasový asistent ordinace z čísla $from.</p>
    <div class="qr" id="qr" aria-label="QR kód pro zapojení do ukázky"></div>
    <div class="url" id="url"></div>
    <div class="count" id="count" aria-live="polite">0</div>
    <div class="muted">zapojených</div>
    <div class="actions">
      <button type="button" id="call">Prozvonit všechny</button>
      <button type="button" class="quiet" id="new">Nová ukázka (smaže seznam)</button>
      <a class="muted" href="/app/">Zpět do aplikace</a>
    </div>
  </section>
  <section>
    <div class="sum" id="sum"></div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </section>
</div>
<script>
const L = { joined: "Čeká na hovor", queued: "Ve frontě", calling: "Volám", ringing: "Zvoní", talking: "Hovor",
  interested: "Má zájem", not_now: "Teď ne", declined: "Nemá zájem", unclear: "Bez odpovědi",
  no_answer: "Hovor nepřijat", limit: "Denní limit", error: "Chyba" };
const OK = new Set(["interested"]), MISS = new Set(["no_answer", "unclear", "declined", "not_now", "limit", "error"]);
const LIVE = new Set(["queued", "calling", "ringing", "talking"]);
let shown = "", eventId = "";
const $ = (id) => document.getElementById(id);
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "/login?next=/sal"; return null; }
  return r.json();
}
function card(p) {
  const cls = OK.has(p.status) ? "ok" : MISS.has(p.status) ? "miss" : LIVE.has(p.status) ? "live" : "";
  const fb = (p.fallback || []).filter((f) => f !== "failed").map((f) => f === "sms" ? "SMS odeslána" : "E-mail odeslán").join(", ");
  return `<div class="card ${cls}"><b>${p.n}</b><span class="tag">${p.phone}${p.email ? ", e-mail" : ""}</span>
    <span class="st">${L[p.status] || p.status}</span>${fb ? `<span class="tag">${fb}</span>` : ""}</div>`;
}
async function refresh() {
  const h = await api("/api/hall");
  if (!h) return;
  if (h.id !== eventId) { eventId = h.id; $("qr").innerHTML = h.qr; $("url").textContent = h.joinUrl.replace(/^https?:\/\//, ""); }
  $("count").textContent = h.count;
  const c = {}; h.participants.forEach((p) => { c[p.status] = (c[p.status] || 0) + 1; });
  $("sum").innerHTML = Object.entries(c).map(([k, v]) => `<span>${L[k] || k}: ${v}</span>`).join("");
  const html = h.participants.map(card).join("");
  if (html !== shown) { $("grid").innerHTML = html; shown = html; }
  $("call").disabled = !h.callable;
  $("call").textContent = h.callable ? `Prozvonit všechny (${h.callable})` : "Prozvonit všechny";
}
$("call").addEventListener("click", async () => { $("call").disabled = true; await api("/api/hall/call", { method: "POST" }); refresh(); });
$("new").addEventListener("click", async () => {
  if (!confirm("Začít novou ukázku? Seznam zapojených se smaže.")) return;
  await api("/api/hall/new", { method: "POST" }); shown = ""; refresh();
});
refresh(); setInterval(refresh, 1500);
</script>
</body>
</html>
